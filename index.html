<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0f">
  <meta name="description" content="PUGI PLAYER - modern offline music player with bass boost and equalizer.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg">
  <title>PUGI PLAYER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">P</span><span>PUGI</span></div>
    <nav>
      <button class="nav-btn active" data-view="home">⌂ <span>Home</span></button>
      <button class="nav-btn" data-view="discover">◉ <span>Discover</span></button>
      <button class="nav-btn" data-view="library">♫ <span>My Library</span></button>
      <button class="nav-btn" data-view="downloads">⇩ <span>Offline</span></button>
      <button class="nav-btn" data-view="favorites">♥ <span>Favorites</span></button>
      <button class="nav-btn" data-view="playlists">☷ <span>Playlists</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button id="installBtn" class="install-btn hidden">＋ Install PUGI</button>
      <small>PUGI PLAYER V1</small>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="mobileMenu" class="icon-btn mobile-only">☰</button>
      <div class="search-wrap">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Search songs, artists, albums...">
        <button id="clearSearch" class="clear-search hidden">×</button>
      </div>
      <button id="addMusicBtn" class="round-btn" title="Add music">＋</button>
      <input id="fileInput" type="file" accept="audio/*" multiple hidden>
    </header>

    <section id="content"></section>
  </main>

  <section class="player">
    <div class="now">
      <img id="playerCover" src="assets/default-cover.svg" alt="">
      <div class="now-text">
        <strong id="playerTitle">No song selected</strong>
        <span id="playerArtist">Add music to start</span>
      </div>
      <button id="favoriteBtn" class="icon-btn" title="Favorite">♡</button>
    </div>

    <div class="controls">
      <div class="control-row">
        <button id="shuffleBtn" class="control">⤨</button>
        <button id="prevBtn" class="control">◀</button>
        <button id="playBtn" class="play-main">▶</button>
        <button id="nextBtn" class="control">▶</button>
        <button id="repeatBtn" class="control">↻</button>
      </div>
      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input id="seekBar" type="range" min="0" max="100" value="0">
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="player-tools">
      <button id="queueBtn" class="tool-btn">☷ Queue</button>
      <button id="fxBtn" class="tool-btn">♫ FX</button>
      <button id="volumeBtn" class="tool-btn">🔊</button>
      <input id="volumeBar" type="range" min="0" max="1" step=".01" value=".9">
    </div>
  </section>

  <div id="overlay" class="overlay hidden"></div>

  <aside id="fxPanel" class="side-panel">
    <div class="panel-head"><h2>Audio FX</h2><button class="close-panel">×</button></div>
    <div class="fx-item">
      <div class="fx-label"><span>Bass Boost</span><b id="bassValue">60%</b></div>
      <input id="bassRange" type="range" min="0" max="100" value="60">
    </div>
    <div class="fx-item">
      <div class="fx-label"><span>Treble</span><b id="trebleValue">50%</b></div>
      <input id="trebleRange" type="range" min="0" max="100" value="50">
    </div>
    <div class="fx-item">
      <div class="fx-label"><span>Volume</span><b id="fxVolumeValue">90%</b></div>
      <input id="fxVolumeRange" type="range" min="0" max="100" value="90">
    </div>
    <h3>Presets</h3>
    <div class="preset-grid">
      <button data-preset="normal">Normal</button>
      <button data-preset="bass">Deep Bass</button>
      <button data-preset="rock">Rock</button>
      <button data-preset="hiphop">Hip-Hop</button>
    </div>
    <div class="visualizer">
      <canvas id="visualizerCanvas"></canvas>
    </div>
  </aside>

  <aside id="queuePanel" class="side-panel queue-panel">
    <div class="panel-head"><h2>Queue</h2><button class="close-panel">×</button></div>
    <div id="queueList" class="queue-list"></div>
  </aside>

  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
